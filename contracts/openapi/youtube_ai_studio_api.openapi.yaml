components:
  schemas:
    Archive:
      properties:
        expected_updated_at:
          type: string
          title: Expected Updated At
      additionalProperties: false
      type: object
      required:
      - expected_updated_at
      title: Archive
    ChannelCreate:
      properties:
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
      additionalProperties: false
      type: object
      required:
      - name
      - slug
      title: ChannelCreate
    ChannelUpdate:
      properties:
        expected_updated_at:
          type: string
          title: Expected Updated At
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
      additionalProperties: false
      type: object
      required:
      - expected_updated_at
      title: ChannelUpdate
    DnaApproval:
      properties:
        expected_head_revision:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Head Revision
        expected_sha256:
          type: string
          title: Expected Sha256
        actor:
          type: string
          maxLength: 200
          minLength: 1
          title: Actor
        reviewed_at:
          type: string
          maxLength: 80
          minLength: 1
          title: Reviewed At
      additionalProperties: false
      type: object
      required:
      - expected_head_revision
      - expected_sha256
      - actor
      - reviewed_at
      title: DnaApproval
    DnaRevision:
      properties:
        channel_dna:
          type: object
          title: Channel Dna
        expected_head_revision:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Head Revision
        expected_head_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Head Artifact Id
      additionalProperties: false
      type: object
      required:
      - channel_dna
      title: DnaRevision
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProjectCreate:
      properties:
        channel_id:
          type: string
          title: Channel Id
        name:
          type: string
          title: Name
        slug:
          type: string
          title: Slug
      additionalProperties: false
      type: object
      required:
      - channel_id
      - name
      - slug
      title: ProjectCreate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
