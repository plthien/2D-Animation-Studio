name: C2 animation-only Windows gates
on:
  push:
    branches: [feat/c2-atomic-animation-cutover]
  pull_request:
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'contracts/animation/**'
      - 'src/**'
      - 'tests/c2/**'
      - 'package*.json'
      - 'requirements.txt'
      - '.github/workflows/c2-animation-cutover.yml'
      - 'scripts/windows/**'
      - 'start.bat'
  workflow_dispatch:

jobs:
  c2:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python
        run: python -m pip install -r requirements.txt
      - name: Test animation C2 platform
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/c2 tests/c0/test_animation_contracts.py tests/c0/test_api_contract_docs.py tests/c0/test_database_contract.py tests/c0/test_g0_evidence.py
      - name: Verify exact OpenAPI and source reachability
        run: python tools/check_c2_cutover.py
      - name: Frontend dependency clean install
        run: npm ci --ignore-scripts
      - name: Frontend typecheck and build
        run: npm run build
      - name: Install pinned Playwright browser tooling (test only)
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install chromium
      - name: Real Chromium Channel DNA Project restart & screenshots
        run: node tools/c2_browser.mjs
      - name: Compare ten G0 and C2 screenshots
        run: |
          python -m pip install Pillow==12.3.0
          python tools/c2_g0_compare.py
      - name: Preserve Windows browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-cockpit-screenshots
          path: |
            artifacts/c2/*.png
            artifacts/c2/*.json
          if-no-files-found: warn
      - name: Python security audit (reported separately)
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r requirements.txt
      - name: Node production dependency audit (reported separately)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Actual Windows launcher first-run, spaced path and shutdown
        run: ./tests/c2/windows_launcher_smoke.ps1
      - name: Verify future API routes not registered
        run: |
          python -c "from app.main import app; print('C2 OpenAPI endpoints:',sum(len(v) for v in app.openapi()['paths'].values()))"
      - name: Windows hosted runner disclosure
        run: Write-Output "Windows-latest is Windows Server, not consumer Windows 11 evidence."
