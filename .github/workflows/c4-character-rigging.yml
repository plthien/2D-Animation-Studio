name: C4 character rigging Windows
on:
  push:
    branches: [feat/c4-character-rigging-studio]
  pull_request:
    paths:
      - 'app/animation/**'
      - 'app/main.py'
      - 'src/**'
      - 'tests/c4/**'
      - 'contracts/animation/api/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/c4-character-rigging.yml'
  workflow_dispatch:
jobs:
  c4-focused:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact HEAD
        run: |
          $target = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          if ((git rev-parse HEAD).Trim() -ne $target) { throw "C4_SHA_MISMATCH" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real C4 image SQLite tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/c4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Affected C3 assets and C2 endpoint regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/c3/test_authoring_local_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: API contract parity
        run: |
          python tools/check_c2_cutover.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install frontend
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck and build
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Notice
        run: Write-Host "Pixel/SQLite/TypeScript gates only; real official loader and G2 remain NOT_RUN until verified"
