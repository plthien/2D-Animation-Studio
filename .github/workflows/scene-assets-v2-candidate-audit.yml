name: Main Candidate Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-candidate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-review-gates:
    name: Backend review gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record candidate SHA
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = git rev-parse HEAD
          Write-Host "CANDIDATE_SHA=$actual"
          if ($actual -ne $expected) { throw "Checkout SHA mismatch" }
          git status --short

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install FFmpeg for Voice pacing acceptance
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate isolated Kokoro Python dependencies
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "kokoro-ci-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = Join-Path $venv "Scripts/python.exe"
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -r kokoro/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "import kokoro_onnx, onnxruntime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Alembic head
        shell: pwsh
        run: |
          $heads = @(alembic heads | Where-Object { $_.Contains("(head)") })
          if ($LASTEXITCODE -ne 0 -or $heads.Count -ne 1) { throw "Alembic head count invalid" }
          alembic upgrade head
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate contracts
        run: python tools/validate_contracts.py

      - name: Audit Voice legacy architecture closure
        run: python tools/audit_voice_first_legacy.py

      - name: Audit Redis and RQ runtime closure
        run: python tools/audit_no_redis_rq.py

      - name: Export runtime OpenAPI
        run: python -c "import yaml; from app.main import app; open('runtime-openapi.yaml','w',encoding='utf-8').write(yaml.safe_dump(app.openapi(), sort_keys=False, allow_unicode=True))"

      - name: Persist runtime OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: runtime-openapi
          path: runtime-openapi.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Run focused Voice regression suite
        id: focused_voice_pytest
        run: |
          python -m pytest -q tests/v4/test_voice_*.py --junitxml=voice-junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Persist focused Voice pytest diagnostics
        if: ${{ always() && (steps.focused_voice_pytest.outcome == 'success' || steps.focused_voice_pytest.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: voice-junit
          path: voice-junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Run full backend regression suite
        id: backend_pytest
        run: |
          python -m pytest -q --junitxml=backend-junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Persist backend pytest diagnostics
        if: ${{ always() && (steps.backend_pytest.outcome == 'success' || steps.backend_pytest.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend-junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Remove transient audit outputs before manifest verification
        run: Remove-Item runtime-openapi.yaml,voice-junit.xml,backend-junit.xml -ErrorAction SilentlyContinue

      - name: Generate deterministic release manifest
        if: github.head_ref != 'feat/c0-clean-cutover-contracts'
        run: |
          python tools/package_manifest.py generate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Persist generated release manifest
        if: github.head_ref != 'feat/c0-clean-cutover-contracts'
        uses: actions/upload-artifact@v4
        with:
          name: generated-manifest
          path: MANIFEST.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed release manifest
        if: github.head_ref != 'feat/c0-clean-cutover-contracts'
        run: |
          git diff --exit-code -- MANIFEST.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record C0 manifest freeze
        if: github.head_ref == 'feat/c0-clean-cutover-contracts'
        run: echo "Legacy YTB package authority is transitional and intentionally not regenerated during C0."

      - name: Verify candidate source remained clean
        if: ${{ always() }}
        run: |
          if (git status --porcelain -- app src tests contracts) { throw "Baseline source unexpectedly modified" }

  frontend-review-gates:
    name: Frontend and cutover review gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record candidate SHA
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = git rev-parse HEAD
          Write-Host "CANDIDATE_SHA=$actual"
          if ($actual -ne $expected) { throw "Checkout SHA mismatch" }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm.cmd ci

      - name: Run frontend and architecture tests
        run: npm.cmd test

      - name: Type-check and build frontend
        run: npm.cmd run build

  windows-render-gates:
    name: Windows Render review gates
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record candidate SHA
        shell: pwsh
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = git rev-parse HEAD
          Write-Host "CANDIDATE_SHA=$actual"
          if ($actual -ne $expected) { throw "Exact candidate SHA mismatch: expected $expected actual $actual" }
          git status --short

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify FFmpeg and FFprobe
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version

      - name: Audit Redis and RQ runtime closure
        run: python tools/audit_no_redis_rq.py

      - name: Run Windows Render lifecycle and launcher regression
        run: >-
          python -m pytest -q
          tests/v4/test_render_windows_process_lifecycle.py
          tests/v4/test_render_windows_input_aliases.py
          tests/v4/test_render_pixel_format_contract.py
          tests/v4/test_render_durable_runner.py
          tests/v4/test_render_durable_cutover.py
          tests/test_windows_release_packaging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
