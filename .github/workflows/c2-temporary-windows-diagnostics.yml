name: C2 temporary targeted Windows pytest diagnosis
on:
  push:
    branches: [feat/c2-atomic-animation-cutover]
    paths: ['tools/c2_diagnostics_request.txt']
jobs:
  platform-schema-api:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pytest-timeout==2.4.0
      - name: Run individual schema and API regressions with verbose test identity
        env: {PYTHONPATH: '.'}
        run: python -m pytest -vv -s --timeout=25 --timeout-method=thread tests/c2/test_fresh_animation_database.py tests/c2/test_platform.py
  neutral-win32:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt pytest-timeout==2.4.0
      - name: Run Win32 Job Object and strict parser tests with bounded subprocess
        env: {PYTHONPATH: '.'}
        run: python -m pytest -vv -s --timeout=45 --timeout-method=thread tests/c2/test_neutral.py
