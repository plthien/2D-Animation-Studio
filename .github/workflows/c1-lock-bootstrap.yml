name: C1 dependency lock bootstrap (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/spine-feasibility/package.json
      - .github/workflows/c1-lock-bootstrap.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lock for review (do not mutate branch)
        working-directory: experiments/spine-feasibility
        shell: pwsh
        run: |
          npm.cmd install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "process.stdout.write('C1LOCKJSON=' + JSON.stringify(require('fs').readFileSync('package-lock.json','utf8')) + '\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: c1-generated-lock-${{ github.event.pull_request.head.sha }}
          path: experiments/spine-feasibility/package-lock.json
