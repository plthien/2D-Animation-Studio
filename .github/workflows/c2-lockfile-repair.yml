name: C2 reviewable compatible lockfile remediation
on:
  push:
    branches: [feat/c2-atomic-animation-cutover]
    paths: ['tools/c2_dependency_repair_request.txt']
permissions:
  contents: write
jobs:
  compatible-patches:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/c2-atomic-animation-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply npm-compatible security patches to lockfile only
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          $fixStatus = $LASTEXITCODE
          Write-Host "npm audit fix compatible-only exit code $fixStatus"
          git diff --stat -- package-lock.json
          if (git diff --quiet -- package-lock.json) {
            Write-Host "No compatible lockfile updates available"
            exit 0
          }
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'C2_LOCKFILE_INSTALL_FAILED' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'fix(c2): apply semver-compatible audited lockfile security patches'
          if ($LASTEXITCODE -ne 0) { throw 'C2_LOCKFILE_COMMIT_FAILED' }
          git push origin HEAD:feat/c2-atomic-animation-cutover
          if ($LASTEXITCODE -ne 0) { throw 'C2_LOCKFILE_PUSH_FAILED' }
