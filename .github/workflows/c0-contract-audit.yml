name: C0 contract audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c0-linux:
    name: C0 contracts (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact event head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-c0.txt

      - name: Install pinned C0 dependencies
        run: python -m pip install -r tools/requirements-c0.txt

      - name: Validate ledger, reachability, DB, contracts, evidence and scope
        shell: bash
        run: |
          set -o pipefail
          mkdir -p c0-reports
          python tools/check_c0_ledger.py | tee c0-reports/ledger.txt
          python tools/verify_c0_reachability.py | tee c0-reports/reachability.txt
          python tools/check_c0_db_contract.py | tee c0-reports/database.txt
          python tools/validate_c0_contracts.py | tee c0-reports/contracts.txt
          python tools/check_g0_evidence.py | tee c0-reports/g0.txt
          python tools/check_c0_scope.py | tee c0-reports/scope.txt
          git diff --check

      - name: Run independent C0 tests
        run: python -m pytest tests/c0 -q --confcutdir=tests/c0 --junitxml=c0-reports/pytest.xml

      - name: Upload C0 reports and G0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-audit-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            c0-reports/
            docs/qa/evidence/g0/*.png
            docs/qa/evidence/g0/manifest.json
          if-no-files-found: error

  c0-windows:
    name: C0 portability (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact event head
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_HEAD) { throw 'Checkout is not the event PR head' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-c0.txt

      - name: Install pinned C0 dependencies
        run: python -m pip install -r tools/requirements-c0.txt

      - name: Validate C0 under Windows paths and locale
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force c0-reports | Out-Null
          python tools/check_c0_ledger.py | Tee-Object c0-reports/ledger.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_c0_reachability.py | Tee-Object c0-reports/reachability.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_c0_db_contract.py | Tee-Object c0-reports/database.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_c0_contracts.py | Tee-Object c0-reports/contracts.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_g0_evidence.py | Tee-Object c0-reports/g0.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_c0_scope.py | Tee-Object c0-reports/scope.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Run independent C0 tests
        run: python -m pytest tests/c0 -q --confcutdir=tests/c0 --junitxml=c0-reports/pytest.xml

      - name: Upload Windows C0 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-audit-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: c0-reports/
          if-no-files-found: error
