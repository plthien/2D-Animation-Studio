name: Refresh deterministic release artifacts

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - feat/c0-clean-cutover-contracts
      - feat/c1-spine-feasibility
    paths-ignore:
      - MANIFEST.json
      - contracts/openapi/youtube_ai_studio_api.openapi.yaml

permissions:
  contents: write

concurrency:
  group: release-artifact-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-release-artifacts:
    name: Refresh static OpenAPI and MANIFEST.json
    runs-on: windows-latest
    if: github.ref_name != 'feat/c0-clean-cutover-contracts' && github.ref_name != 'feat/c1-spine-feasibility'
    timeout-minutes: 20
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Export canonical static OpenAPI
        run: >-
          python -c "import yaml; from app.main import app; open('contracts/openapi/youtube_ai_studio_api.openapi.yaml','w',encoding='utf-8').write(yaml.safe_dump(app.openapi(), sort_keys=False, allow_unicode=True))"

      - name: Generate deterministic release manifest
        run: python tools/package_manifest.py generate

      - name: Verify refresh scope
        shell: pwsh
        run: |
          $allowed = @('MANIFEST.json','contracts/openapi/youtube_ai_studio_api.openapi.yaml')
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected generated paths" }
          if (git status --porcelain -- app src tests) { throw "Source modified" }
      - name: Commit refreshed release artifacts
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -in @('feat/c0-clean-cutover-contracts','feat/c1-spine-feasibility')) { throw 'Protected experiment branch' }
          git diff --quiet -- MANIFEST.json contracts/openapi/youtube_ai_studio_api.openapi.yaml
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MANIFEST.json contracts/openapi/youtube_ai_studio_api.openapi.yaml
          $staged = @(git diff --cached --name-only)
          if (@($staged | Where-Object { $_ -notin @('MANIFEST.json','contracts/openapi/youtube_ai_studio_api.openapi.yaml') }).Count -gt 0) { throw 'Unexpected staged files' }
          git commit -m 'chore: refresh deterministic release artifacts'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin ('HEAD:' + $env:GITHUB_REF_NAME)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
